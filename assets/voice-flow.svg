<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">Real-time voice AI data flow</title>
  <desc id="desc">A professional isometric-style pipeline showing audio capture flowing into speech recognition, LLM orchestration, and synthesized voice output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070a14"/><stop offset=".55" stop-color="#111936"/><stop offset="1" stop-color="#24112e"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a5f3fc"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ede9fe"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fce7f3"/><stop offset="1" stop-color="#db2777"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5 0 7z" fill="#67e8f9"/></marker>
  </defs>
  <rect width="1200" height="410" rx="30" fill="url(#bg)"/>
  <g opacity=".12" stroke="#a78bfa" fill="none"><path d="M0 330L300 0M130 410L470 0M720 410L1120 0M930 410L1200 160"/><path d="M0 92h1200M0 184h1200M0 276h1200M0 368h1200"/></g>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="54" y="48" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="3">VOICE INTELLIGENCE PIPELINE</text>
    <text x="1146" y="48" fill="#64748b" font-size="12" text-anchor="end" letter-spacing="2">STREAM / UNDERSTAND / RESPOND</text>
  </g>
  <g filter="url(#shadow)">
    <g><path d="M58 145h300l18 18v146H76l-18-18z" fill="#070f1e" stroke="#164e63" stroke-width="2"/><path d="M76 127h300l18 18H94z" fill="#123047" stroke="#22d3ee" stroke-width="2"/><path d="M376 127v164l18 18V145z" fill="#0c2236"/></g>
    <g><path d="M445 118h310l18 18v166H463l-18-18z" fill="#100f2d" stroke="#4c1d95" stroke-width="2"/><path d="M463 100h310l18 18H481z" fill="#2a1b5b" stroke="#8b5cf6" stroke-width="2"/><path d="M773 100v184l18 18V118z" fill="#1c1645"/></g>
    <g><path d="M844 145h300l18 18v146H862l-18-18z" fill="#211022" stroke="#9d174d" stroke-width="2"/><path d="M862 127h300l18 18H880z" fill="#4b1737" stroke="#ec4899" stroke-width="2"/><path d="M1162 127v164l18 18V145z" fill="#32142b"/></g>
  </g>
  <g font-family="Arial,Helvetica,sans-serif">
    <g><rect x="94" y="151" width="38" height="24" rx="12" fill="#22d3ee"/><text x="113" y="168" text-anchor="middle" fill="#06202a" font-size="12" font-weight="800">01</text><text x="148" y="169" fill="#cffafe" font-size="12" letter-spacing="2">INPUT SIGNAL</text><path d="M106 220q20-36 40 0t40 0t40 0" fill="none" stroke="url(#cyan)" stroke-width="5" stroke-linecap="round"/><text x="94" y="266" fill="#f8fafc" font-size="24" font-weight="800">STT</text><text x="94" y="288" fill="#94a3b8" font-size="13">Audio → transcript</text><text x="94" y="309" fill="#64748b" font-size="11">VAD · confidence · timestamps</text></g>
    <g><rect x="481" y="124" width="38" height="24" rx="12" fill="#8b5cf6"/><text x="500" y="141" text-anchor="middle" fill="#160d35" font-size="12" font-weight="800">02</text><text x="535" y="142" fill="#ddd6fe" font-size="12" letter-spacing="2">DECISION LAYER</text><circle cx="600" cy="201" r="32" fill="none" stroke="url(#violet)" stroke-width="5"/><circle cx="600" cy="201" r="11" fill="#a78bfa"/><path d="M548 252h104M568 270h64" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round"/><text x="481" y="304" fill="#f8fafc" font-size="22" font-weight="800">LLM ORCHESTRATION</text><text x="481" y="326" fill="#a5b4fc" font-size="13">Context · tools · memory · guardrails</text></g>
    <g><rect x="880" y="151" width="38" height="24" rx="12" fill="#ec4899"/><text x="899" y="168" text-anchor="middle" fill="#3b0a26" font-size="12" font-weight="800">03</text><text x="934" y="169" fill="#fbcfe8" font-size="12" letter-spacing="2">OUTPUT STREAM</text><path d="M900 220q20-20 40 0t40 0t40 0" fill="none" stroke="url(#pink)" stroke-width="5" stroke-linecap="round"/><text x="880" y="266" fill="#f8fafc" font-size="24" font-weight="800">TTS</text><text x="880" y="288" fill="#f9a8d4" font-size="13">Response → voice</text><text x="880" y="309" fill="#f472b6" font-size="11">Prosody · streaming · playback</text></g>
  </g>
  <g fill="none" stroke="#67e8f9" stroke-width="3" stroke-dasharray="10 10" marker-end="url(#arrow)" filter="url(#glow)"><path d="M380 224H435"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/></path><path d="M797 224H834"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/></path></g>
  <g fill="#67e8f9" filter="url(#glow)"><circle cx="390" cy="224" r="5"><animate attributeName="cx" values="380;435;380" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="807" cy="224" r="5"><animate attributeName="cx" values="797;834;797" dur="1.8s" repeatCount="indefinite"/></circle></g>
  <rect x="54" y="365" width="1092" height="2" fill="url(#edge)" opacity=".6"/><text x="600" y="391" fill="#64748b" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="12" letter-spacing="2">LOW LATENCY  ·  OBSERVABLE  ·  HUMAN-CENTERED</text>
</svg>
